<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ngaos Al Falah Ploso</title>


<style>

body{

    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111;
    font-family:Arial,sans-serif;
    color:white;

}


.player-box{

    width:90%;
    max-width:420px;
    background:#1e1e1e;
    padding:25px;
    border-radius:20px;
    text-align:center;

}


h1{

    font-size:22px;

}


#status{

    margin:20px 0;
    color:#aaa;

}


button{

    padding:14px 30px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    font-size:16px;

}


input{

    width:100%;
    margin-top:25px;

}


</style>

</head>


<body>


<div class="player-box">


<h1>
Ngaos Al Falah Ploso
</h1>


<div id="status">
Siap
</div>


<button id="playButton">
▶ Play
</button>


<input
id="volume"
type="range"
min="0"
max="1"
step="0.01"
value="1"
/>


</div>





<!-- CORE -->

<script src="js/npc.js"></script>


<script src="js/env.js"></script>

<script src="js/config.js"></script>



<script src="js/core/events.js"></script>

<script src="js/core/logger.js"></script>




<!-- AUTH -->

<script src="js/auth/adapter.js"></script>

<script src="js/auth/mapper.js"></script>

<script src="js/auth/clerk.js"></script>

<script src="js/auth/auth.js"></script>




<!-- PLAYER -->

<script src="js/player/engine.js"></script>

<script src="js/player/metadata.js"></script>

<script src="js/player/volume.js"></script>

<script src="js/player/reconnect.js"></script>

<script src="js/player/sleep.js"></script>

<script src="js/player/statistics.js"></script>

<script src="js/player/controller.js"></script>

<script src="js/player/player.js"></script>




<!-- APP -->

<script src="js/app.js"></script>




<script>


window.addEventListener(
"DOMContentLoaded",
async ()=>{


    const button =
    document.getElementById(
        "playButton"
    );


    const status =
    document.getElementById(
        "status"
    );


    const volume =
    document.getElementById(
        "volume"
    );



    const stream =

        NPC.Config.radio.streamUrl;



    NPC.Player.load(
        stream
    );



    button.onclick = async ()=>{


        try{


            if(
                NPC.Player.isPlaying()
            ){


                NPC.Player.pause();


                button.innerHTML =
                "▶ Play";


                status.innerHTML =
                "Paused";


            }
            else{


                await NPC.Player.play();



                button.innerHTML =
                "⏸ Pause";


                status.innerHTML =
                "Playing";


            }


        }
        catch(error){


            console.error(
                error
            );


            status.innerHTML =
            "Gagal memutar radio";


        }


    };





    volume.oninput = ()=>{


        NPC.Player.volume(
            volume.value
        );


    };



});



</script>


</body>

</html>

<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ngaos Radio Player</title>


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#111;

    font-family:Arial,sans-serif;

    color:white;

}



.player{

    width:90%;

    max-width:400px;

    padding:30px;

    text-align:center;

    background:#222;

    border-radius:20px;

}



h1{

    font-size:24px;

}



.status{

    margin:20px 0;

    color:#aaa;

}



button{

    padding:15px 35px;

    border:none;

    border-radius:30px;

    font-size:18px;

    cursor:pointer;

}



input{

    width:100%;

    margin-top:25px;

}


</style>


</head>


<body>


<div class="player">


<h1>
Ngaos Radio
</h1>


<div id="status" class="status">
Siap
</div>



<button id="play">
▶ Play
</button>



<input 
id="volume"
type="range"
min="0"
max="1"
step="0.01"
value="1"
>



<audio id="audio"></audio>


</div>




<script>


const STREAM =

"https://uk14freenew.listen2myradio.com/live.mp3?typeportmount=s1_27764_stream_367452469";



const audio =
document.getElementById(
"audio"
);



const button =
document.getElementById(
"play"
);



const status =
document.getElementById(
"status"
);



const volume =
document.getElementById(
"volume"
);



audio.src =
STREAM;



button.onclick =
async function(){


    try{


        if(audio.paused){


            await audio.play();


            button.innerHTML =
            "⏸ Pause";


            status.innerHTML =
            "Sedang memutar";


        }
        else{


            audio.pause();


            button.innerHTML =
            "▶ Play";


            status.innerHTML =
            "Berhenti";


        }


    }

    catch(error){


        console.error(error);


        status.innerHTML =
        "Gagal memutar stream";


    }


};



volume.oninput =
function(){


    audio.volume =
    volume.value;


};



</script>


</body>

</html>
